# Deploys the app stack and the page on every push to main, and only then.
# Nobody deploys by hand (#8). It deploys only once the gate is green and
# the eval has a report for main's own fingerprint at or above every gating
# floor, and it records which report covers the release
# (docs/constraints/deploy-gates.md).
#
# There is no rollback. A failed deploy is fixed forward, and CloudFormation
# rolls a failed stack update back by itself.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and none cancelled part way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Governor's deploy messages label every ticket a deploy ships.
  TICKET_LABEL_PATHS: all

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # The eval for main's own commit. Two pull requests that each passed
  # against an older main are scored again together if their combination
  # is new; otherwise the report already filed is reused.
  eval:
    uses: ./.github/workflows/eval.yml
    # Without this, the called job reads the eval environment's secrets as
    # empty, though it names the environment (#81).
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write

  # A workflow can read an environment's secret only in a job that names
  # the environment, so this job reads whether the deploy role is set. It is
  # the only value GitHub holds for the deploy: once the job has assumed the
  # role, it finds or builds every other (#43). Until the owner runs the
  # bootstrap, a merge runs the gate and deploys nothing.
  role:
    name: deploy role
    runs-on: ubuntu-24.04
    environment: prod
    outputs:
      set: ${{ steps.read.outputs.set }}
    steps:
      - id: read
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set in prod, so nothing deploys. The README says how to set it."
          fi

  deploy:
    name: "deploy · deployed: grantlink"
    needs: [gate, role, eval]
    if: needs.role.outputs.set == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts

      # The release record ships with the function and the page. It is
      # refused unless the eval's report is for this commit's own
      # fingerprint and clears every gating floor.
      - name: Record the release
        env:
          REPORT: ${{ needs.eval.outputs.report }}
          FINGERPRINT: ${{ needs.eval.outputs.fingerprint }}
          COMMIT: ${{ github.sha }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          own="$(node evals/fingerprint.ts)"
          if [ "$own" != "$FINGERPRINT" ]; then
            echo "::error::The eval scored fingerprint $FINGERPRINT, but this commit's is $own."
            exit 1
          fi
          printf '%s' "$REPORT" > report.json
          node evals/check.ts gate report.json "$own"
          node src/page/release.ts report.json site/release.json

      # Assumes the deploy role through GitHub's OIDC token, with the AWS
      # CLI the runner ships, so no outside action holds the credentials.
      # The account id, the token and the credentials are masked before
      # anything else runs, so no later line prints them.
      - name: Assume the deploy role
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE" \
            --role-session-name "grantlink-deploy-$GITHUB_RUN_ID" \
            --web-identity-token "$token" \
            --duration-seconds 3600 \
            --output json)"
          account="$(jq -r .AssumedRoleUser.Arn <<< "$creds" | cut -d: -f5)"
          key="$(jq -r .Credentials.AccessKeyId <<< "$creds")"
          secret="$(jq -r .Credentials.SecretAccessKey <<< "$creds")"
          session="$(jq -r .Credentials.SessionToken <<< "$creds")"
          echo "::add-mask::$account"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "AWS_SESSION_TOKEN=$session"
          } >> "$GITHUB_ENV"

      # The first run over the back catalogue starts from a one-time
      # schedule, a quarter of an hour after the deploy that creates it.
      # Later deploys keep that time from the stack's FirstRunAt output, so
      # they start no second run.
      - name: Keep the first run's time
        id: first
        run: |
          set -euo pipefail
          # Only a stack that does not exist yet gets a new time. Any other
          # error stops the deploy, so it never moves the first run.
          if at="$(aws cloudformation describe-stacks --stack-name grantlink-prod \
            --query "Stacks[0].Outputs[?OutputKey=='FirstRunAt'].OutputValue" \
            --output text 2>describe-stacks.err)"; then
            :
          elif grep -q "does not exist" describe-stacks.err; then
            at=""
          else
            cat describe-stacks.err >&2
            exit 1
          fi
          if [ -z "$at" ] || [ "$at" = "None" ]; then
            at="$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%S)"
          fi
          echo "at=$at" >> "$GITHUB_OUTPUT"

      # The stack is grantlink-prod in eu-west-2, as serverless.yml names it.
      # serverless.yml reads the certificate from the DNS stack and builds
      # the execution role's ARN from this account, and CloudFront serves
      # the page at grantlink.uk (#44).
      - name: Deploy the app stack
        env:
          FIRST_RUN_AT: ${{ steps.first.outputs.at }}
        run: npx sls deploy

      - name: Read the stack's outputs
        id: stack
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name grantlink-prod \
            --query "Stacks[0].Outputs" --output json)"
          output() {
            jq -er --arg key "$1" '.[] | select(.OutputKey == $key) | .OutputValue' <<< "$outputs"
          }
          {
            echo "bucket=$(output SiteBucketName)"
            echo "distribution=$(output DistributionId)"
            echo "url=$(output PageUrl)"
          } >> "$GITHUB_OUTPUT"

      # Builds the page again from the last run's data, uploads the site,
      # and keeps a page a run publishes during the deploy (#46).
      - name: Publish the page
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: scripts/publish-page.sh

      # The live tier reads the page as a visitor would. A failure here
      # turns the deploy red.
      - name: Read the live page
        env:
          PAGE_URL: ${{ steps.stack.outputs.url }}
        run: npm run test:live
