# Runs the conformance tests once a day and on demand (#56). They read setup
# outside the repo: GitHub's record of the repository, which the roles' OIDC
# subjects must match (#52), the prod environment's branch rule
# (deploy-gates.md), the funding text bucket's settings (storage.md,
# evals.md), and governor's wait ticket, the issue .github/governor.json
# names, which must stay open (#471). A rename, a transfer, a changed
# setting or a closed wait ticket then turns this run red instead of
# waiting for a deploy to fail, and governor's redScheduledRun starts a
# session on the red run. A fix that only the owner can make, such as a
# GitHub setting, goes from that session to the owner as an issue.
name: conformance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Checkout needs contents: read. The repository's record and the wait
# ticket need no permission while the repository is public. If it goes
# private, the wait ticket's read fails and turns the run red until this
# grants issues: read. The prod environment and its branch policies
# need actions: read. The OIDC token for the conformance role needs
# id-token: write.
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # The job names no environment. The conformance role trusts runs on main,
  # and a job in an environment would carry that environment's subject.
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts

      # Assumes the conformance role through GitHub's OIDC token, as the
      # deploy and the eval assume theirs. The account id, the token and the
      # credentials are masked before anything else runs. The private bucket
      # is grantlink-text-<account id>, as the app stack names it, so the
      # role is the only value GitHub holds for this run (#43). The
      # credentials and the bucket's name are this step's outputs, and only
      # the step that runs the tests names them in its env (#308).
      - name: Assume the conformance role
        id: assume
        env:
          ROLE: ${{ secrets.AWS_CONFORMANCE_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE" ]; then
            echo "::error::The AWS_CONFORMANCE_ROLE_ARN repository secret is not set. The README says how to set it."
            exit 1
          fi
          # Prints a JSON reply's field, or names the field in an error and
          # fails. jq -e alone fails on a missing field without saying which,
          # and passes an empty string (#160, #188). jq's own error is
          # dropped, as it can quote the reply.
          field() {
            if ! jq -er "$2 | strings | select(length > 0)" <<< "$1" 2> /dev/null; then
              echo "::error::The $3 reply has no $2, or it is empty, or the reply is not JSON." >&2
              return 1
            fi
          }
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          token="$(field "$oidc" .value OIDC)"
          echo "::add-mask::$token"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE" \
            --role-session-name "grantlink-conformance-$GITHUB_RUN_ID" \
            --web-identity-token "$token" \
            --duration-seconds 3600 \
            --output json)"
          # An ARN with no account field leaves it empty, and cut -s leaves
          # it empty too for a value with no colon.
          arn="$(field "$creds" .AssumedRoleUser.Arn STS)"
          account="$(cut -s -d: -f5 <<< "$arn")"
          if [ -z "$account" ]; then
            echo "::error::The STS reply's role ARN names no account."
            exit 1
          fi
          echo "::add-mask::$account"
          key="$(field "$creds" .Credentials.AccessKeyId STS)"
          secret="$(field "$creds" .Credentials.SecretAccessKey STS)"
          session="$(field "$creds" .Credentials.SessionToken STS)"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "key=$key"
            echo "secret=$secret"
            echo "session=$session"
            echo "bucket=grantlink-text-$account"
          } >> "$GITHUB_OUTPUT"

      # Runs after a failed assume too. A rename or a transfer changes the
      # OIDC subject, so STS refuses the role, and
      # test/github-oidc.conformance.ts is the check that says why. The
      # role's outputs are then empty, and the bucket's checks fail on that.
      - name: Run the conformance tests
        run: npm run conformance
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ steps.assume.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume.outputs.secret }}
          AWS_SESSION_TOKEN: ${{ steps.assume.outputs.session }}
          TEXT_BUCKET: ${{ steps.assume.outputs.bucket }}
