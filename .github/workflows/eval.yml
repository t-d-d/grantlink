# The eval (#9). On every pull request, and on every push to main through
# deploy.yml, it computes the eval's fingerprint and takes the report filed
# under it in eval-reports/, or runs the eval and files one. A report below
# a gating floor fails the job, which stops the merge and the deploy (#8).
#
# The S3 reads and writes sit in this workflow's own steps. The runner reads
# local files only, and src/extract/, src/shared/ and evals/ import nothing
# from outside the fingerprinted paths (docs/constraints/evals.md). Logs
# print paper ids and scores only: the snapshot's files hold funding text
# and names, and nothing here prints them.
#
# This file is one of the fingerprint's inputs, so a change here runs the
# eval again.
name: eval

on:
  pull_request:
  workflow_call:
    outputs:
      fingerprint:
        description: The eval's fingerprint for the commit
        value: ${{ jobs.eval.outputs.fingerprint }}
      report:
        description: The report filed under the fingerprint, as compact JSON
        value: ${{ jobs.eval.outputs.report }}

permissions:
  contents: read

jobs:
  eval:
    name: eval
    runs-on: ubuntu-24.04
    environment: eval
    permissions:
      contents: read
      id-token: write
      # The pull request's comment with CI's scores.
      pull-requests: write
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.value }}
      report: ${{ steps.report.outputs.json }}
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts

      # Assigned first: a failure inside echo's arguments would not stop the
      # step, and would hand on an empty fingerprint (#92).
      - id: fingerprint
        name: Compute the fingerprint
        run: |
          set -euo pipefail
          fingerprint="$(node evals/fingerprint.ts)"
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      # Assumes the eval role through GitHub's OIDC token, as the deploy
      # assumes its own. The account id, the token and the credentials are
      # masked before anything else runs. The private bucket is
      # grantlink-text-<account id>, as the app stack names it, so the role
      # is the only value GitHub holds for the eval (#43). The credentials
      # and the bucket's name are this step's outputs, and only the steps
      # that call AWS name them in their env, so no other step's code holds
      # them (#308).
      - name: Assume the eval role
        id: assume
        env:
          ROLE: ${{ secrets.AWS_EVAL_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_EVAL_ROLE_ARN is not set in the eval environment. The README says how to set it."
            exit 1
          fi
          # Prints a JSON reply's field, or names the field in an error and
          # fails. jq -e alone fails on a missing field without saying which,
          # and passes an empty string (#160). jq's own error is dropped, as
          # it can quote the reply.
          field() {
            if ! jq -er "$2 | strings | select(length > 0)" <<< "$1" 2> /dev/null; then
              echo "::error::The $3 reply has no $2, or it is empty, or the reply is not JSON." >&2
              return 1
            fi
          }
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          token="$(field "$oidc" .value OIDC)"
          echo "::add-mask::$token"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE" \
            --role-session-name "grantlink-eval-$GITHUB_RUN_ID" \
            --web-identity-token "$token" \
            --duration-seconds 3600 \
            --output json)"
          # An ARN with no account field leaves it empty, and cut -s leaves
          # it empty too for a value with no colon.
          arn="$(field "$creds" .AssumedRoleUser.Arn STS)"
          account="$(cut -s -d: -f5 <<< "$arn")"
          if [ -z "$account" ]; then
            echo "::error::The STS reply's role ARN names no account."
            exit 1
          fi
          echo "::add-mask::$account"
          key="$(field "$creds" .Credentials.AccessKeyId STS)"
          secret="$(field "$creds" .Credentials.SecretAccessKey STS)"
          session="$(field "$creds" .Credentials.SessionToken STS)"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "key=$key"
            echo "secret=$secret"
            echo "session=$session"
            echo "bucket=grantlink-text-$account"
          } >> "$GITHUB_OUTPUT"

      # The report is a cache keyed by the fingerprint (#9). Listing with
      # the key as a prefix is how the role asks whether it exists. The
      # listing asks for one page: the CLI merges pages by default, and the
      # merged result has no KeyCount, so every lookup read as a miss (#672).
      #
      # The app stack creates the private bucket, and the deploy needs this
      # job, so before the first deploy there is no bucket. Then nothing is
      # filed and no snapshot can be pinned, so the eval scores no gold set,
      # files nothing, and hands its report to the deploy that creates the
      # bucket. After a deleted stack the bucket is missing too, though a
      # snapshot is pinned, until the owner copies it back after the deploy
      # that makes the bucket again. The eval then downloads nothing and
      # scores as before a snapshot is pinned, so that deploy is not
      # stopped (#253).
      - id: cached
        name: Look for the report filed for this fingerprint
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.assume.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume.outputs.secret }}
          AWS_SESSION_TOKEN: ${{ steps.assume.outputs.session }}
          BUCKET: ${{ steps.assume.outputs.bucket }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          key="eval-reports/$FINGERPRINT.json"
          if ! count="$(aws s3api list-objects-v2 --no-paginate --bucket "$BUCKET" --prefix "$key" \
            --query KeyCount --output text 2>list.err)"; then
            if grep -q NoSuchBucket list.err; then
              echo "::notice::The private bucket does not exist, so no snapshot is read and no report is filed. The next deploy creates it."
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "bucket=missing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat list.err >&2
            exit 1
          fi
          if [ "$count" = "1" ]; then
            aws s3api get-object --bucket "$BUCKET" --key "$key" report.json >/dev/null
            echo "Reusing the report already filed for this fingerprint."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the snapshot
        if: steps.cached.outputs.hit != 'true' && steps.cached.outputs.bucket != 'missing'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.assume.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume.outputs.secret }}
          AWS_SESSION_TOKEN: ${{ steps.assume.outputs.session }}
        run: scripts/eval-snapshot.sh .eval

      # The runner scores the rules, then each model, through OpenRouter
      # (#329). The eval's key has its own credit limit (#328), and only this
      # step holds it.
      - name: Run the eval
        if: steps.cached.outputs.hit != 'true'
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NO_BUCKET: ${{ steps.cached.outputs.bucket == 'missing' }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node evals/run.ts .eval report.json

      # Written once: S3 refuses the write if a report is already there, as
      # when another run for the same fingerprint filed first. That one
      # stands, and this run takes it.
      - name: File the report
        if: steps.cached.outputs.hit != 'true' && steps.cached.outputs.bucket != 'missing'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.assume.outputs.key }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume.outputs.secret }}
          AWS_SESSION_TOKEN: ${{ steps.assume.outputs.session }}
          BUCKET: ${{ steps.assume.outputs.bucket }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          key="eval-reports/$FINGERPRINT.json"
          if aws s3api put-object --bucket "$BUCKET" --key "$key" --body report.json \
            --content-type application/json --if-none-match '*' >/dev/null 2>put.err; then
            echo "Filed the report."
          elif grep -q PreconditionFailed put.err; then
            aws s3api get-object --bucket "$BUCKET" --key "$key" report.json >/dev/null
            echo "Another run filed a report for this fingerprint first. Taking it."
          else
            cat put.err >&2
            exit 1
          fi

      - id: report
        name: Hand the report on
        run: |
          json="$(jq -ce . report.json)"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      # A release is live once its page is published (#85). The deploy
      # writes the release record and publishes it beside the page, with the
      # report that covers the live release. That report was filed under the
      # fingerprint the live release's own code worked out, which this pull
      # request's code cannot work out again when it changes the inputs, so
      # the step takes the report from the record (#139). If the record
      # cannot be read, is not one JSON value, or holds no report, there is
      # nothing to compare with, and the comment shows CI's scores alone
      # (#88). The report is written to live.json under $RUNNER_TEMP only,
      # never printed. It sits outside the working tree, so a live.json the
      # pull request's tree holds is never taken for it (#233).
      - id: live
        name: Read the live release's report
        if: github.event_name == 'pull_request' && steps.cached.outputs.bucket != 'missing'
        env:
          RELEASE_URL: https://grantlink.uk/release.json
        run: |
          set -euo pipefail
          if ! record="$(curl -sSf --retry 2 --max-time 30 "$RELEASE_URL")" \
            || ! live="$(jq -ces 'select(length == 1) | .[0].report | objects' <<< "$record" 2>/dev/null)"; then
            echo "::warning::Could not read the report in the live page's release record, so there is nothing to compare with."
            echo "reason=page-unread" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$live" > "$RUNNER_TEMP/live.json"

      # One comment per pull request, updated on each run. When the step
      # above was skipped, the private bucket does not exist: no deploy has
      # run, or the stack was deleted (#253). When it ran, it gives its own
      # reason, and a missing one fails here rather than reading as no
      # deploy. The comment
      # chooses on that reason, not on whether a file exists, and compares
      # only with the report the step wrote (#233).
      - name: Comment with CI's scores beside the live release's
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NO_LIVE: ${{ steps.live.outcome == 'skipped' && 'no-deploy' || steps.live.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "$NO_LIVE" ]; then
            node evals/check.ts comment report.json "$RUNNER_TEMP/live.json" > comment.md
          else
            node evals/check.ts comment report.json --no-live "$NO_LIVE" > comment.md
          fi
          # All the ids first, then the first line, with no pipe: a reader
          # that stops early sends gh SIGPIPE and fails the step (#257).
          # --jq runs once per page, so it alone cannot pick the first.
          # Only a comment github-actions[bot] wrote, as GH_TOKEN does, is its
          # own: anyone can post the marker, and the token cannot edit their
          # comment (#298).
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- grantlink:eval -->"))) | .id')"
          id="${ids%%$'\n'*}"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

      # Last, so the comment shows the scores even when they fail.
      - name: Gate on the floors
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: node evals/check.ts gate report.json "$FINGERPRINT"
